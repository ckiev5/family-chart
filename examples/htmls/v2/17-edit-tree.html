
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>v2/17-edit-tree</title>
  <link rel="shortcut icon" type="image/svg" href="/examples/logo.svg">
  <script src="https://unpkg.com/d3@7"></script>
  <link rel="stylesheet" href="/src/styles/family-chart.css">
  <style> body { font-family: 'Arial', sans-serif; } </style>
</head>
<body>
<div id="FamilyChart" class="f3" style="width:100%;height:900px;margin:auto;background-color:rgb(33,33,33);color:#fff;"></div>
<script type="module">
import f3 from '../../../src/index.js'

// list of all example. delete this if not needed
import sidebar from '../../sidebar.js'
sidebar()

fetch('../../data/data.json')
  .then(res => res.json())
  .then(data => create(data))
  .catch(err => console.error(err))

function findTopMostMaleId(data) {
  if (!Array.isArray(data) || data.length === 0) return null;

  const isRoot = (d) => {
    const rels = d.rels || {};
    return !rels.father && !rels.mother;
  };

  const roots = data.filter(isRoot);
  if (roots.length === 0) {
    // Không có ai là root → fallback node đầu tiên
    return data[0].id;
  }

  // Ưu tiên giới tính Nam
  const maleRoots = roots.filter((d) => {
    const g = (d.data?.gender || '').toUpperCase();
    return g === 'M' || g === 'NAM';
  });

  if (maleRoots.length === 0) {
    // Không có Nam ở tầng root → lấy root đầu tiên
    return roots[0].id;
  }

  // Có nhiều Nam root → tạm lấy người đầu tiên
  return maleRoots[0].id;
}

function create(data) {
  const f3Chart = f3.createChart('#FamilyChart', data)
    .setTransitionTime(1000)
    .setCardXSpacing(250)
    .setCardYSpacing(150);

  const f3Card = f3Chart.setCardHtml()
    .setCardDisplay([["first name","last name"],["birthday"]]);

  const f3EditTree = f3Chart.editTree()
    .setFields(["first name","last name","birthday"])
    .setEditFirst(true)  // click card mở form edit
    .setCardClickOpen(f3Card)
    .fixed()
    .setLinkExistingRelConfig({
      title: "Thêm người từ danh sách có sẵn",
      select_placeholder: "Chọn một người...",
      linkRelLabel: (d) => {
        const first = d.data?.["first name"] ?? "";
        const last = d.data?.["last name"] ?? "";
        const birth = d.data?.["birthday"] ? ` (${d.data["birthday"]})` : "";

        const rels = [];
        if (d.rels?.parents?.length) rels.push("child");
        if (d.rels?.children?.length) rels.push("parent");
        if (d.rels?.spouses?.length) rels.push("spouse");
        const relStr = rels.length ? ` – ${rels.join("/")}` : "";

        return `${first} ${last}${birth}${relStr}`;
      },
    });

  // 👉 1. Tìm ông Nam “cao nhất”
  const fixedMainId = findTopMostMaleId(data);

  if (fixedMainId) {
    // 👉 2. Monkey-patch updateMainId để ở đâu gọi cũng luôn về fixedMainId
    const originalUpdateMainId = f3Chart.updateMainId.bind(f3Chart);

    f3Chart.updateMainId = function (_anyId) {
      // luôn set main là fixedMainId, bỏ qua param truyền vào
      return originalUpdateMainId(fixedMainId);
    };

    // Set main lần đầu
    f3Chart.updateMainId(fixedMainId);
  }

  // 👉 3. Vẽ cây, canh main ở giữa
  f3Chart.updateTree({ initial: true});

  // Tuỳ bạn có cần auto mở form cho main không:
  // f3EditTree.open(f3Chart.getMainDatum());
}

</script>
</body>
</html>
